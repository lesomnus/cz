name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz string literals
        if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzStringLiteral$' -fuzztime 10s -parallel 2
      - name: Fuzz bytes literals
        if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzBytesLiteral$' -fuzztime 10s -parallel 2
